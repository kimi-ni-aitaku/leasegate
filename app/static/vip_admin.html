<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LeaseGate · VIP 运营后台</title><link rel="stylesheet" href="/static/vip.css"><script type="module" src="/static/vip.js"></script></head>
<body data-page="admin"><header><a class="brand" href="/vip-admin"><span class="brand-icon">L</span>LeaseGate <small>运营后台</small></a><a href="/qr" class="quiet">买家入口 ↗</a></header><main class="admin-layout"><div class="eyebrow">VIP ACCOUNT OPERATIONS</div><h1>账号、卡密与登录记录。</h1><p class="muted">批量管理授权库存，查看每一笔扫码请求。</p>
<form id="admin-login" class="panel login-panel"><label for="admin-secret">管理员密钥</label><input id="admin-secret" type="password" autocomplete="current-password" required><button type="submit" class="primary wide">进入管理后台</button></form>
<div id="admin-workspace" hidden><div class="admin-top"><div id="gateway-state" class="status"></div><button id="admin-logout" class="secondary">退出登录</button></div><div class="admin-grid"><section class="panel"><div class="eyebrow">ACCOUNT POOL</div><h2>批量导入账号</h2><p class="muted">每行一条 Cookie 或授权端账号引用。导入后需检查，验证通过才进入可用库存。</p><form id="import-form"><div class="form-row"><label>凭据形式<select id="credential-type"><option value="cookie">网页版 Cookie</option><option value="gateway_reference">授权端账号引用</option></select></label><label>每账号设备容量<input id="account-capacity" type="number" min="1" max="100" value="1"></label></div><label for="account-lines">账号凭据（每行一条）</label><textarea id="account-lines" rows="5" spellcheck="false" autocomplete="off" required placeholder="Cookie 或私有授权端账号引用"></textarea><button type="submit" class="primary">加密导入</button></form></section>
<section class="panel"><div class="eyebrow">ACTIVATION CARDS</div><h2>批量生成卡密</h2><form id="cards-form"><label for="card-name">商品名称<input id="card-name" value="24 小时电脑授权" maxlength="80"></label><div class="form-row"><label>生成数量<input id="card-number" type="number" min="1" max="100" value="1"></label><label>授权时长（小时）<input id="card-hours" type="number" min="0.016667" max="720" step="any" value="24"></label></div><div class="form-row"><label>扫码次数<input id="card-scans" type="number" min="1" max="1000" value="7"></label><label>电脑绑定上限<input id="card-devices" type="number" min="1" max="10" value="1"></label></div><label>未激活有效期（天）<input id="card-valid" type="number" min="1" max="30" value="7"></label><button type="submit" class="primary">生成卡密和临时链接</button></form></section></div>
<section id="rotate-box" class="panel" hidden><h2>更新账号凭据：<span id="rotate-alias"></span></h2><p class="muted">更新后需重新检查。有占用会话的账号暂时不能替换凭据。</p><form id="rotate-form"><label for="rotate-credential">新的 Cookie 或授权端引用</label><textarea id="rotate-credential" rows="4" spellcheck="false" autocomplete="off" required></textarea><button type="submit" class="primary">加密更新</button><button id="rotate-cancel" type="button" class="secondary">取消</button></form></section>
<section id="issued-box" class="panel" hidden><div class="panel-heading"><h2>本批次卡密</h2><button id="export-cards" class="secondary">下载卡密 TXT</button></div><p class="muted">卡密原文只在生成时显示，请及时保存。</p><textarea id="issued-cards" readonly rows="5"></textarea></section>
<nav class="tabs"><button class="selected" data-collection="accounts">账号池</button><button data-collection="cards">卡密</button><button data-collection="tasks">登录任务</button><button data-collection="bindings">设备绑定</button><button id="refresh" class="quiet">刷新</button></nav><div class="panel table-panel"><div class="table-scroll"><table><thead id="table-head"></thead><tbody id="table-body"></tbody></table></div><div class="pagination"><button id="previous" class="secondary">上一页</button><span id="page-label"></span><button id="next" class="secondary">下一页</button></div></div></div><div id="status" class="status" role="status" aria-live="polite"></div></main><footer>LeaseGate <span>运营后台 · 加密凭据 · 审计记录</span></footer></body></html>
